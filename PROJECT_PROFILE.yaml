schema_version: 6

project:
  repo: rasokiwayami/freelance-os
  type: portfolio_product_candidate
  domain: freelance_operations
  primary_goal: Local-first freelance business management app with Supabase-backed workflows
  default_branch: master
  visibility: private_or_public_per_current_remote
  authority:
    # These are target-local filters; central authority and task evidence still decide execution.
    allowed_actions:
      - dev.local_inspect
      - dev.local_edit
      - dev.local_test
      - dev.local_commit
      - dev.github_push
    forbidden_actions:
      - dev.repo_create_visibility_deploy_or_publish
      - dev.secret_or_security_mutation
      - dev.production_data_mutation
      - auth.secret_read_or_print
      - finance.spending_or_paid_service_change
      - dev.destructive_action

runtime:
  local_only: true
  deployment: vercel_configured_but_not_default_action
  languages:
    - javascript
  package_managers:
    - npm
  operating_environment:
    - Mac local operation under /Users/sora/dev/freelance-os
    - Legacy Windows/WSL operation remains a normal Node/Vite context

verification:
  default:
    - npm run lint
    - npm run test
    - npm run build
  formatting:
    - git diff --check

state:
  ignored_runtime_dirs:
    - node_modules/
    - dist/
    - coverage/
    - playwright-report/
    - test-results/
  canonical_progress:
    - AGENTS.md
    - PROJECT_PROFILE.yaml
    - CLAUDE.md
    - package.json
    - src/
